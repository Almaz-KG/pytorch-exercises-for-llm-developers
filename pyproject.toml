[project]
name = "pytorch-exercises"
version = "0.1.0"
description = "Rustlings-style PyTorch / tensor-algebra exercises, LLM-flavoured"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8",
    "numpy>=2.0",
    "pytest>=8.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.uv]
# `docs` is a default group so that `uv run mkdocs serve` works straight after `uv sync`.
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["templates", "attempts", "solutions", "site", ".venv", "__pycache__"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["attempts", "site"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722", "E741", "PLR0402"]

[tool.ruff.lint.extend-per-file-ignores]
"test_*.py" = ["F401"]
